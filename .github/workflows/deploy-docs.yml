name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'virentia-labs/documentation'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy docs
        timeout-minutes: 15
        env:
          DEPLOY_HOST: ${{ secrets.SERVER }}
          DEPLOY_USER: ${{ secrets.SERVER_LOGIN }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.TARGET_DIR }}
          DEPLOY_HOST_KEY: ${{ secrets.DOCS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing SERVER}"
          : "${DEPLOY_USER:?Missing SERVER_LOGIN}"
          : "${SSHPASS:?Missing SERVER_PASSWORD}"
          : "${DEPLOY_DIR:?Missing TARGET_DIR}"
          : "${DEPLOY_HOST_KEY:?Missing DOCS_SSH_HOST_KEY}"

          if ! command -v rsync >/dev/null || ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rsync sshpass
          fi

          known_hosts="$(mktemp "$RUNNER_TEMP/docs-known-hosts.XXXXXX")"
          ssh_config="$(mktemp "$RUNNER_TEMP/docs-ssh.XXXXXX")"
          printf 'docs-deploy %s\n' "$DEPLOY_HOST_KEY" > "$known_hosts"
          cat > "$ssh_config" <<EOF
          Host docs-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port 22
            BatchMode no
            ConnectTimeout 12
            ConnectionAttempts 1
            NumberOfPasswordPrompts 1
            PreferredAuthentications keyboard-interactive,password
            StrictHostKeyChecking yes
            HostKeyAlias docs-deploy
            UserKnownHostsFile "$known_hosts"
          EOF

          export RSYNC_RSH="sshpass -e ssh -F '$ssh_config'"
          rsync --recursive --checksum --compress --protect-args --delay-updates --stats \
            ./docs/.vitepress/dist/ "docs-deploy:${DEPLOY_DIR%/}/"

      - name: Verify published docs
        run: |
          set -euo pipefail
          published="$(mktemp "$RUNNER_TEMP/docs-index.XXXXXX")"
          curl --fail --silent --show-error --compressed --retry 3 --retry-delay 2 \
            --retry-max-time 35 --connect-timeout 5 --max-time 15 \
            -H 'Cache-Control: no-cache' \
            "https://movpushmov.dev/virentia/?deployment=$GITHUB_SHA" -o "$published"
          cmp docs/.vitepress/dist/index.html "$published"
