name: Diagnose docs SFTP

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check SFTP authentication and target directory
        env:
          SFTP_HOST: ${{ secrets.SERVER }}
          SFTP_USER: ${{ secrets.SERVER_LOGIN }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SFTP_TARGET: ${{ secrets.TARGET_DIR }}
        run: |
          set -euo pipefail
          : "${SFTP_HOST:?Missing SERVER}"
          : "${SFTP_USER:?Missing SERVER_LOGIN}"
          : "${SSHPASS:?Missing SERVER_PASSWORD}"
          : "${SFTP_TARGET:?Missing TARGET_DIR}"

          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi

          known_hosts="$(mktemp "$RUNNER_TEMP/docs-known-hosts.XXXXXX")"
          if ! ssh-keyscan -H -T 8 -p 22 "$SFTP_HOST" > "$known_hosts" 2>/dev/null || [[ ! -s "$known_hosts" ]]; then
            echo "::error::The configured server did not present an SSH host key"
            exit 1
          fi
          echo "SSH host-key exchange succeeded"

          if [[ "$SFTP_TARGET" == *\"* || "$SFTP_TARGET" == *\\* || "$SFTP_TARGET" == *$'\r'* || "$SFTP_TARGET" == *$'\n'* ]]; then
            echo "::error::TARGET_DIR contains characters this SFTP probe cannot quote"
            exit 1
          fi

          result=0
          printf 'cd "%s"\npwd\nquit\n' "$SFTP_TARGET" |
            timeout 45s sshpass -e sftp -v -P 22 -o ConnectTimeout=12 -o ConnectionAttempts=1 \
              -o BatchMode=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o PreferredAuthentications=password,keyboard-interactive -b - "$SFTP_USER@$SFTP_HOST" \
              > "$RUNNER_TEMP/docs-sftp-output" 2> "$RUNNER_TEMP/docs-sftp-error" || result=$?
          if [[ "$result" == 0 ]]; then
            echo "SFTP authentication and access to TARGET_DIR succeeded"
          else
            if grep -qi 'Authenticated to' "$RUNNER_TEMP/docs-sftp-error"; then
              echo "SSH authentication succeeded"
            fi
            case "$result" in
              124) echo "::error::The SFTP session or target directory check timed out after 45 seconds" ;;
              5) echo "::error::The server rejected the configured SFTP password" ;;
              *)
                grep -E -i 'permission denied|authentication failed|host key verification failed|timed out|connection closed|connection refused|remote chdir|no such file|subsystem request failed|couldn.t canonicalize' "$RUNNER_TEMP/docs-sftp-error" || true
                echo "::error::SFTP target check exited with status $result"
                ;;
            esac
            exit "$result"
          fi
