<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virentia UI · Counters</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 40px auto; padding: 0 24px; max-width: 900px; }
    h1 { margin-bottom: 24px; }
    nav { display: flex; gap: 12px; margin-bottom: 24px; }
    .counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
    .counter { border: 1px solid #8886; padding: 24px; border-radius: 12px; }
    .counter h2 { margin-top: 0; }
    button { padding: 8px 14px; margin-right: 8px; font: inherit; cursor: pointer; }
    output { display: block; margin-top: 18px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
